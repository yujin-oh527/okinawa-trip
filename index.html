const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(buf);
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById('g'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='여는 중…';
  try{const html=await open_(pw.value); try{localStorage.setItem('okinawa-pw',pw.value)}catch(_){} show(html);}
  catch(_){err.textContent='비밀번호가 맞지 않아요. 다시 입력해 주세요.'; go.disabled=false; go.textContent='일정 보기'; pw.select();}
});
(async()=>{let s=null; try{s=localStorage.getItem('okinawa-pw')}catch(_){}
  if(s){go.disabled=true; go.textContent='여는 중…'; try{show(await open_(s));}catch(_){try{localStorage.removeItem('okinawa-pw')}catch(e){} go.disabled=false; go.textContent='일정 보기';}}})();
})();
